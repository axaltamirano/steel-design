[project]
name = "steel-design"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Altamirano", email = "hi@andrewaltamirano.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pint>=0.26.2",
]

