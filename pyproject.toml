[project]
name = "steel-design"
version = "0.1.0"
description = "AISC 360-22 steel member design checks in US customary units, managed with pint"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Andrew Altamirano", email = "hi@andrewaltamirano.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pint>=0.26.2",
]

[project.scripts]
steel-design = "steel_design:main"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "matplotlib>=3.9",
    "myst-parser>=5.1.0",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "sphinx>=9.2.0",
]
